<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş</title><link rel="stylesheet" href="style.css"></head><body>
<main><div class="box card reveal"><div class="tabs"><button data-m="l" class="on">Giriş</button><button data-m="r">Üye Ol</button><button data-m="f">Şifremi Unuttum</button></div>
<input id="fname" placeholder="Ad Soyad" style="display:none"><input id="femail" placeholder="E-posta"><input id="fpass" type="password" placeholder="Şifre (en az 6)">
<input id="fcode" placeholder="E-postaya gelen 6 haneli kod" style="display:none"><button id="btn">Giriş Yap</button><p class="msg" id="msg"></p></div></main>
<script src="app.js"></script><script>
let mode='l',step=0;
function setMode(x){mode=x;step=0;$('fname').style.display=x=='r'?'block':'none';$('fcode').style.display='none';$('fpass').style.display=x=='f'?'none':'block';$('fpass').placeholder='Şifre (en az 6)';
 $('btn').textContent={l:'Giriş Yap',r:'Kod Gönder',f:'Kod Gönder'}[x];$('msg').textContent='';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==x))}
document.querySelector('.tabs').onclick=e=>e.target.dataset.m&&setMode(e.target.dataset.m);
$('btn').onclick=async()=>{const email=$('femail').value,pass=$('fpass').value,code=$('fcode').value;let r;
 if(mode=='l')r=await api('login','POST',{email,pass});
 else if(mode=='r'){if(step==0){r=await api('register','POST',{name:$('fname').value,email,pass});if(r.ok){step=1;$('fcode').style.display='block';$('btn').textContent='Kodu Doğrula';$('msg').textContent='Kod e-postanıza gönderildi.';return}}else r=await api('verify','POST',{email,code})}
 else{if(step==0){r=await api('forgot','POST',{email});if(r.ok){step=1;$('fcode').style.display='block';$('fpass').style.display='block';$('fpass').placeholder='Yeni şifre';$('btn').textContent='Şifreyi Değiştir';$('msg').textContent='Hesap varsa kod gönderildi.';return}}else r=await api('reset','POST',{email,code,pass})}
 r.ok?location.href='magaza.html':$('msg').textContent=r.error}
</script></body></html>
