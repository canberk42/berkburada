<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş — berkburada</title><link rel="stylesheet" href="style.css?v=4"><script>try{if(localStorage.theme==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script></head><body>
<main><div class="box card reveal"><div class="tabs"><button data-m="l" class="on">Giriş</button><button data-m="r">Üye ol</button><button data-m="f">Şifremi unuttum</button></div>
<input id="fname" placeholder="Ad soyad" autocomplete="name" style="display:none"><input id="femail" placeholder="E-posta" autocomplete="email"><input id="fpass" type="password" placeholder="Şifre, en az 6 karakter">
<input id="fcode" placeholder="E-postana gelen 6 haneli kod" inputmode="numeric" style="display:none"><button id="btn" style="width:100%">Giriş yap</button><p class="msg" id="msg"></p></div></main>
<script src="app.js?v=4"></script><script>
let mode='l',step=0;
function setMode(x){mode=x;step=0;$('fname').style.display=x=='r'?'block':'none';$('fcode').style.display='none';$('fpass').style.display=x=='f'?'none':'block';$('fpass').placeholder='Şifre, en az 6 karakter';
 $('btn').textContent={l:'Giriş yap',r:'Kod gönder',f:'Kod gönder'}[x];$('msg').textContent='';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==x))}
document.querySelector('.tabs').onclick=e=>e.target.dataset.m&&setMode(e.target.dataset.m);
$('btn').onclick=async()=>{const email=$('femail').value,pass=$('fpass').value,code=$('fcode').value;let r;
 if(mode=='l')r=await api('login','POST',{email,pass});
 else if(mode=='r'){if(step==0){r=await api('register','POST',{name:$('fname').value,email,pass});if(r.ok){step=1;$('fcode').style.display='block';$('btn').textContent='Kodu doğrula';$('msg').textContent='Kod e-postana gönderildi';return}}else r=await api('verify','POST',{email,code})}
 else{if(step==0){r=await api('forgot','POST',{email});if(r.ok){step=1;$('fcode').style.display='block';$('fpass').style.display='block';$('fpass').placeholder='Yeni şifre';$('btn').textContent='Şifreyi değiştir';$('msg').textContent='Hesap varsa kod gönderildi';return}}else r=await api('reset','POST',{email,code,pass})}
 r.ok?location.href='/magaza':$('msg').textContent=r.error}
</script></body></html>
