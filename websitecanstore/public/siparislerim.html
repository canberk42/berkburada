<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siparişlerim</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1 class="reveal">Siparişlerim</h1><p class="msg" id="note"></p><div id="ol"></div></main>
<script src="app.js"></script><script>
window.pageInit=async me=>{if(!me.user){ol.innerHTML='<p>Görmek için <a href="giris.html" style="color:#ff4fa3">giriş yapın</a>.</p>';return}
 const q=location.search;$('note').textContent=q=='?ok'?'Ödemeniz alındı, teşekkürler!':q=='?fail'?'Ödeme başarısız oldu.':'';
 const o=await api('my-orders');$('ol').innerHTML=o.map(x=>`<div class="card reveal" style="margin-bottom:16px"><b>Sipariş #${x.id}</b> — <span class="price">${x.total.toFixed(2)} ₺</span><p class="mut">${esc(x.created)}</p><p>${JSON.parse(x.items).map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</p><p>Durum: <b style="color:#ff4fa3">${esc(x.status)}</b></p></div>`).join('')||'<p class="mut">Henüz siparişiniz yok.</p>'}
</script></body></html>
