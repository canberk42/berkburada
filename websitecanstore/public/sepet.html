<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sepet — berkburada</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1 class="reveal">Sepet</h1>
<div class="notice" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
<div><b>Havale / EFT ile ödeyecekseniz</b><p>Havale açıklamasına sipariş numaranızı ve altına <b>kullanıcı adınızı</b> yazmayı unutmayınız. Böylece ödemeniz siparişinizle hemen eşleşir.<span id="who"></span></p></div></div>
<div id="cartbox"></div><div id="co" class="card" style="display:none;margin-top:24px;max-width:560px"><h2>Teslimat ve ödeme</h2>
<label for="an">Ad soyad</label><input id="an" autocomplete="name"><label for="ap">Telefon</label><input id="ap" placeholder="+905xxxxxxxxx" autocomplete="tel"><label for="ac">Şehir</label><input id="ac"><label for="aa">Açık adres</label><textarea id="aa" rows="3"></textarea>
<label for="pm">Ödeme yöntemi</label><select id="pm"><option value="card">Kredi / banka kartı (iyzico)</option><option value="eft">Havale / EFT</option><option value="cod">Kapıda ödeme</option></select><button id="buy">Siparişi tamamla</button></div><p class="msg" id="msg"></p></main>
<script src="app.js"></script><script>
let P=[];
function draw(){const c=cart.get();let t=0;const rows=P.filter(p=>c[p.id]).map(p=>{t+=p.price*c[p.id];return `<tr><td>${esc(p.name)}</td><td class="r num mut">${c[p.id]} adet</td><td class="r price">${money(p.price*c[p.id])}</td><td class="r"><button class="sm" data-rm="${p.id}">Kaldır</button></td></tr>`}).join('');
 $('cartbox').innerHTML=rows?`<div class="tablewrap"><table>${rows}</table></div><div class="total"><span class="mut">Toplam</span><span class="price">${money(t)}</span></div>`:'<p class="empty">Sepetin boş. <a href="/magaza">Mağazaya göz at</a></p>';$('co').style.display=rows?'block':'none'}
$('cartbox').onclick=e=>{const id=e.target.dataset.rm;if(id){const c=cart.get();delete c[id];cart.set(c);draw()}};
$('buy').onclick=async()=>{const r=await api('order','POST',{items:cart.get(),method:$('pm').value,address:{name:$('an').value,phone:$('ap').value,city:$('ac').value,address:$('aa').value}});
 if(r.error){$('msg').innerHTML=esc(r.error)+(r.error=='Giriş yapın'?' · <a href="/giris">Giriş yap veya üye ol</a>':'');return}
 cart.clear();if(r.url){location.href=r.url;return}draw();$('co').style.display='none';
 $('msg').textContent='Siparişin alındı (No: '+r.id+'). '+(r.iban?'Havale için IBAN: '+r.iban+' — açıklamaya sipariş numaranı ve altına kullanıcı adını ('+(ME.name||'')+') yaz.':'')}
let ME={};
window.pageInit=async me=>{ME=me||{};if(ME.name)$('who').innerHTML=' Kullanıcı adınız: <b class="num">'+esc(ME.name)+'</b>';P=await api('products');draw()}
</script></body></html>
