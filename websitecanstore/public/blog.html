<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog — berkburada</title><link rel="stylesheet" href="style.css"><script>try{if(localStorage.theme==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script></head><body>
<main><h1 class="reveal">Blog</h1><div id="p" style="display:grid;gap:16px;max-width:720px"></div></main><script src="app.js" onerror="document.body.innerHTML='<h2 style=padding:40px;color:#fff>app.js yüklenemedi. Siteyi http://localhost:3000 üzerinden açın.</h2>'"></script><script>
window.pageInit=async()=>{p.innerHTML=(await api('posts')).map(x=>`<article class="card reveal"><h2>${esc(x.title)}</h2><p class="mut" style="white-space:pre-line">${esc(x.body)}</p></article>`).join('')||'<p class="empty">Henüz yazı yok</p>'}</script></body></html>
