<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İletişim</title><link rel="stylesheet" href="style.css"></head><body>
<main><div class="box card reveal"><h1 style="font-size:2rem">İletişim</h1><input id="n" placeholder="Adınız"><input id="e" placeholder="E-posta"><textarea id="t" rows="5" placeholder="Mesajınız"></textarea><button onclick="send()">Gönder</button><p class="msg" id="m"></p></div></main>
<script src="app.js" onerror="document.body.innerHTML='<h2 style=padding:40px;color:#fff>app.js yüklenemedi. Siteyi http://localhost:3000 üzerinden açın.</h2>'"></script><script>async function send(){const r=await api('contact','POST',{name:n.value,email:e.value,text:t.value});m.textContent=r.ok?'Mesajınız alındı, teşekkürler!':r.error}</script></body></html>
