<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İletişim — berkburada</title><link rel="stylesheet" href="style.css"><script>try{if(localStorage.theme==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script></head><body>
<main><div class="box reveal"><h1>İletişim</h1><p class="mut" style="margin:-8px 0 24px">Ürün, sipariş ya da web sitesi isteğin için yaz. Yanıt e-postana gelir.</p><div class="card">
<label for="n">Adın</label><input id="n" autocomplete="name"><label for="e">E-posta</label><input id="e" autocomplete="email"><label for="t">Mesaj</label><textarea id="t" rows="5"></textarea><button onclick="send()">Gönder</button><p class="msg" id="m"></p></div></div></main>
<script src="app.js" onerror="document.body.innerHTML='<h2 style=padding:40px;color:#fff>app.js yüklenemedi. Siteyi http://localhost:3000 üzerinden açın.</h2>'"></script><script>async function send(){const r=await api('contact','POST',{name:n.value,email:e.value,text:t.value});m.textContent=r.ok?'Mesajın alındı, teşekkürler':r.error}</script></body></html>
